<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Baccarat Pro</title>
    <style>
        /* 基礎重置與變數 */
        :root {
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #ffffff;
            --red-color: #ff3b30;
            --blue-color: #0A84FF;
            --green-color: #30d158;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 頂部：資金與策略儀表板 */
        .dashboard {
            display: flex;
            justify-content: space-between;
            background-color: var(--panel-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 5px;
        }

        .recommendation {
            color: #FFD700; /* 金色高亮建議 */
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* 控制區：快捷輸入按鈕 */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
        }

        button {
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.8; }
        .btn-banker { background-color: var(--red-color); color: white; }
        .btn-player { background-color: var(--blue-color); color: white; }
        .btn-tie { background-color: var(--green-color); color: white; }
        .btn-action { background-color: #555; color: white; }

        /* 五路路紙矩陣 (核心佈局) */
        .roads-container {
            display: grid;
            grid-template-columns: minmax(200px, 1fr) minmax(400px, 2fr);
            gap: 10px;
            background-color: #ffffff; /* 路紙底色設為白色，仿照實體紙張 */
            padding: 10px;
            border-radius: 8px;
            height: 400px;
        }

        /* 通用網格樣式 */
        .grid-board {
            border-collapse: collapse;
            width: 100%;
            height: 100%;
            table-layout: fixed;
        }

        .grid-board td {
            border: 1px solid #e0e0e0;
            width: 25px;
            height: 25px;
            text-align: center;
            vertical-align: middle;
            position: relative;
        }

        /* 左側：珠盤路 */
        .bead-plate {
            border-right: 2px solid #000;
        }

        /* 右側：大路與下三路組合 */
        .right-roads {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .big-road {
            flex: 2; /* 大路佔據上半部較多空間 */
            border-bottom: 2px solid #000;
        }

        /* 下三路水平排列 */
        .derived-roads {
            flex: 1;
            display: flex;
        }

        .derived-roads > div {
            flex: 1;
            border-right: 1px solid #000;
        }
        .derived-roads > div:last-child {
            border-right: none;
        }
    </style>
</head>
<body>

    <!-- 資金與策略儀表板 -->
    <div class="dashboard">
        <div class="stat-box">
            <span>累計盈虧</span>
            <span class="stat-value" id="total-profit" style="color: var(--green-color);">+$0.00</span>
        </div>
        <div class="stat-box">
            <span>最終權重建議</span>
            <span class="stat-value recommendation" id="ai-recommend">等待輸入...</span>
        </div>
        <div class="stat-box">
            <span>建議下注金額</span>
            <span class="stat-value" id="bet-amount">$0</span>
        </div>
        <div class="stat-box">
            <span>AI 勝率統計</span>
            <span class="stat-value" id="win-rate">0勝 0負 (0%)</span>
        </div>
    </div>

    <!-- 快捷輸入區 -->
    <div class="controls">
        <button class="btn-banker" onclick="addRecord('B')">🔴 開莊 (B)</button>
        <button class="btn-player" onclick="addRecord('P')">🔵 開閒 (P)</button>
        <button class="btn-tie" onclick="addRecord('T')">🟢 開和 (T)</button>
        <button class="btn-action" onclick="undoRecord()">↩️ 撤銷</button>
        <button class="btn-action" onclick="resetBoard()">🗑️ 新靴重置</button>
    </div>

    <!-- 五路矩陣面板 -->
    <div class="roads-container">
        <!-- 珠盤路 (左側) -->
        <div class="bead-plate" id="bead-plate-board">
            <!-- 稍後用 JS 自動生成表格網格 -->
        </div>

        <!-- 右側路單群 -->
        <div class="right-roads">
            <!-- 大路 (右上) -->
            <div class="big-road" id="big-road-board">
            </div>

            <!-- 下三路 (右下並排) -->
            <div class="derived-roads">
                <div class="big-eye" id="big-eye-board"></div>
                <div class="small-road" id="small-road-board"></div>
                <div class="roach-road" id="roach-road-board"></div>
            </div>
        </div>
    </div>

    <script>
        // 全局狀態管理
const state = {
    records: [], // 儲存開牌順序，例如 ['B', 'P', 'T', 'B']
    balance: 0,
    win: 0,
    loss: 0
};

// 1. 初始化五路網格
function initGrid(elementId, rows, cols) {
    const container = document.getElementById(elementId);
    let table = '<table class="grid-board">';
    for (let r = 0; r < rows; r++) {
        table += '<tr>';
        for (let c = 0; c < cols; c++) {
            table += `<td id="${elementId}-${r}-${c}"></td>`;
        }
        table += '</tr>';
    }
    table += '</table>';
    container.innerHTML = table;
}

// 頁面載入時自動繪製所有表格 (標準 6 列)
window.onload = function() {
    initGrid('bead-plate-board', 6, 8);   // 珠盤路
    initGrid('big-road-board', 6, 30);    // 大路
    initGrid('big-eye-board', 6, 15);     // 大眼仔
    initGrid('small-road-board', 6, 15);  // 小路
    initGrid('roach-road-board', 6, 15);  // 曱甴路
};

// 2. 新增開牌紀錄與按鈕點擊事件
function addRecord(result) {
    state.records.push(result);
    renderBeadPlate(); // 畫珠盤路
    
    // 每次輸入後，將數據發送給 PHP 進行 AI 運算
    analyzeWithPHP(); 
}

// 3. 渲染珠盤路 (只負責珠盤路，其他四路交由 PHP 算好座標後回傳)
function renderBeadPlate() {
    // 先清空現有珠盤路
    document.querySelectorAll('#bead-plate-board td').forEach(td => td.innerHTML = '');
    
    const rows = 6;
    state.records.forEach((res, index) => {
        const c = Math.floor(index / rows); // 計算行 (Column)
        const r = index % rows;             // 計算列 (Row)
        const cell = document.getElementById(`bead-plate-board-${r}-${c}`);
        
        if (cell) {
            // 使用實心圓圈與文字代表莊閒和
            if (res === 'B') cell.innerHTML = '<div style="background-color: var(--red-color); color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; margin: 0 auto;">莊</div>';
            if (res === 'P') cell.innerHTML = '<div style="background-color: var(--blue-color); color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; margin: 0 auto;">閒</div>';
            if (res === 'T') cell.innerHTML = '<div style="background-color: var(--green-color); color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; margin: 0 auto;">和</div>';
        }
    });
}

// 4. 撤銷最後一筆
function undoRecord() {
    if(state.records.length > 0) {
        state.records.pop();
        renderBeadPlate();
        analyzeWithPHP(); // 重新分析
    }
}

// 5. 新靴重置
function resetBoard() {
    state.records = [];
    document.querySelectorAll('.grid-board td').forEach(td => td.innerHTML = '');
    document.getElementById('ai-recommend').innerText = "等待輸入...";
    document.getElementById('ai-recommend').style.color = "#FFD700";
    document.getElementById('bet-amount').innerText = "$0";
}

// 6. 核心：呼叫 PHP 後端引擎 (準備用於下一步)
async function analyzeWithPHP() {
    const recommendUI = document.getElementById('ai-recommend');
    recommendUI.innerText = "🧠 AI 運算中...";
    recommendUI.style.color = "#ffffff";

    // 【下一步實作】這裡將會是 fetch('api.php', { method: 'POST', body: JSON.stringify(state.records) })
    // 目前先模擬 PHP 的延遲回傳效果
    setTimeout(() => {
        console.log("目前牌單準備發送給 PHP: ", state.records);
        // 假資料測試 UI：
        // recommendUI.innerText = "正打 莊 (B)";
        // recommendUI.style.color = "var(--red-color)";
    }, 500);
}
    </script>
</body>
</html>
